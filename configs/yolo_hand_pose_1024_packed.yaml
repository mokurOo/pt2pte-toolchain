model:
  adapter: ultralytics_yolo
  weights: ../../yolo_hand/results/runs/yolo_hand_pose_224/checkpoints/best.pt
  input_size: null
  pose_output: packed

calibration:
  provider: image_list
  image_list: ../../yolo_hand/datasets/hand_pose/calibration/train_seed42_500.txt
  count: 500
  seed: 42

target:
  accelerator: ethos-u85-1024
  system_config: Ethos_U85_SYS_DRAM_Mid
  memory_mode: Shared_Sram
  vela_extra_flags:
    - --optimise=Performance
    - --arena-cache-size=4194304

output:
  directory: ../artifacts/yolo_hand_pose_1024_packed
  name: yolo_hand_pose_packed
  save_intermediates: true

diagnostics:
  debug: false
