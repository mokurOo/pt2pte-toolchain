model:
  adapter: ultralytics_yolo
  weights: ../../yolo_hand/results/runs/yolo_hand_pose_224/checkpoints/best.pt
  # null means: read imgsz from the checkpoint. An int or [height, width] overrides it.
  input_size: null

calibration:
  provider: yolo_ndjson
  ndjson: ../../yolo_hand/hand-keypoints.ndjson
  images_root: ../../yolo_hand/datasets/hand_pose/images
  split: train
  count: 200
  seed: 42

target:
  accelerator: ethos-u85-512
  system_config: Ethos_U85_SYS_DRAM_Mid
  memory_mode: Shared_Sram
  vela_extra_flags:
    - --optimise=Performance
    - --arena-cache-size=4194304

output:
  directory: ../artifacts/yolo_hand_pose
  name: yolo_hand_pose
  save_intermediates: true

diagnostics:
  debug: false
